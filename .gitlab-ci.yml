stages:
  - build
  - deploy

variables:
  GITHUB_REPO: "git@github.com:johasam/CleverPromptingRedux.git"
  GITHUB_PAGES_BRANCH: "gh-pages"

build-jupyterlite:
  stage: build
  image: python:3.11-slim
  script:
    - pip install -r requirements-build.txt
    - jupyter lite build --config jupyter_lite_config.json
  artifacts:
    paths:
      - _output/
    expire_in: 1 hour

deploy-to-github-pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build-jupyterlite
  before_script:
    # Install git and openssh
    - apk add --no-cache git openssh-client
    # Set up SSH key from CI/CD variable
    - mkdir -p ~/.ssh
    - echo "$GITHUB_DEPLOY_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    # Add GitHub to known hosts to avoid interactive prompt
    - ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
    - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
    # Configure git identity
    - git config --global user.email "gitlab-ci@d-fine.dev"
    - git config --global user.name "GitLab CI Deploy"
  script:
    # Clone only the gh-pages branch (or create it if it doesn't exist)
    - |
      if git ls-remote --exit-code --heads "$GITHUB_REPO" "$GITHUB_PAGES_BRANCH" >/dev/null 2>&1; then
        git clone --single-branch --branch "$GITHUB_PAGES_BRANCH" "$GITHUB_REPO" gh-pages-repo
      else
        mkdir gh-pages-repo
        cd gh-pages-repo
        git init
        git checkout -b "$GITHUB_PAGES_BRANCH"
        git remote add origin "$GITHUB_REPO"
        cd ..
      fi
    # Replace contents with new build
    - cd gh-pages-repo
    - git rm -rf . 2>/dev/null || true
    - cp -r ../_output/* .
    # Add .nojekyll to bypass Jekyll processing on GitHub Pages
    - touch .nojekyll
    # Commit and push
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes to deploy."
      else
        git commit -m "Deploy JupyterLite site - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        git push origin "$GITHUB_PAGES_BRANCH"
        echo "Deployment successful!"
      fi
  only:
    - main
